name: Auto-assign to Copilot

on:
  issues:
    types: [opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Append text to issue body
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const extraLine = "\n\nWrite the code for this tool inside the tools folder. Assume the tool implements one user-facing task. For a Task Stages section, make one ordered `copilot_llm_call(...)` per stage and explicitly pass useful artifacts to later calls. Use only these capabilities: `general_reasoning`, `ocr`, `object_detection_localization`, `structured_visual_understanding`, `spatial_reasoning`, `navigation`, `camera_motion`, `temporal_reasoning`. Never use `visual_reasoning`. Do not import `litellm`, call `litellm.completion()`, create new model-router clients, create ModelRouter classes, resolve model names, resolve API keys, import detector libraries/provider SDKs/`YOLO`, define `COCO_CLASSES`, hardcode model names, load `.pt` files, or call `YOLO(...)`. Do not select implementations, providers, fallback order, retries, or verification logic in generated tools.";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: issue.body + extraLine
            });
            
      - name: Assign issue creator
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Assign issue to Copilot
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ github.event.issue.number }}
          github_token: ${{ secrets.COPILOT_PAT }}
