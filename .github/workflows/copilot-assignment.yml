name: Auto-assign to Copilot

on:
  issues:
    types: [opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Append text to issue body
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const extraLine = "\n\nImplementation note: Read `.github/copilot-instructions.md`, then modify only the requested Python tool in `tools/` unless the public runtime is genuinely insufficient. Normally implement both Take Photo and Streaming lifecycle hooks and define one concise `TOOL_PROMPT` shared by both. Default the prompt to one direct instruction; add ordered steps only for genuinely dependent visual reasoning. Explicitly choose each entry point's models, frame selection, call timing, orchestration, state, and output behavior. Take Photo uses one current image. Streaming decides whether a changed latest frame or selected chronological history is appropriate. Use runtime frames, state, cancellation, and emission APIs. Keep output concise and audio-friendly for blind and low-vision users, state uncertainty when evidence is insufficient, and restrict clock-face navigation to 9–12 and 1–3.";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: issue.body + extraLine
            });
            
      - name: Assign issue creator
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Assign issue to Copilot
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ github.event.issue.number }}
          github_token: ${{ secrets.COPILOT_PAT }}
