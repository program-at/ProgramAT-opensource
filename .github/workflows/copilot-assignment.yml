name: Auto-assign to Copilot

on:
  issues:
    types: [opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Append text to issue body
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const extraLine = "\n\nWrite this Python tool inside `tools/`. For take-photo mode, author one concise task-specific fused `TOOL_PROMPT` using Task, Expected output, Constraints / examples, and the repository instructions. Copy Difficulty start into `TOOL_DIFFICULTY_START`, pass it to `call_take_photo_baseline_vlm` as `difficulty_start=TOOL_DIFFICULTY_START`, and do not recompute it at runtime. Import `call_take_photo_baseline_vlm` from `litellm_utils`, call it exactly once with `image`, `TOOL_PROMPT`, `TOOL_NAME`, and the stored difficulty, and return its answer directly. Do not create runtime stages or make planner, router, evaluator, specialist, or other model calls.";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: issue.body + extraLine
            });
            
      - name: Assign issue creator
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Assign issue to Copilot
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ github.event.issue.number }}
          github_token: ${{ secrets.COPILOT_PAT }}
