name: Auto-assign to Copilot

on:
  issues:
    types: [opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Append text to issue body
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const extraLine = "\n\nWrite the code for this tool inside the tools folder. Assume the tool implements one user-facing task. If the issue enumerates multiple stages, implement those stages sequentially in the generated tool and pass intermediate outputs from earlier stages into later stages. For any issue with a Task Stages section, each model-backed stage must map to its own copilot_llm_call(...), and each call must use exactly the listed stage capability as task_category. Do not collapse multiple stage capabilities into a single model call. For any LLM or VLM operation, generated tools must call the existing Copilot-routed backend interface through the existing client with `from model_router_client import copilot_llm_call`, then `copilot_llm_call(task_category=..., messages=..., images=..., metadata=...)` for the relevant stage capability. Use only these task_category values: `general_reasoning`, `ocr`, `object_detection`, `map_web`, `spatial_relationship`, `navigation`, `camera_motion`, `video`. Never use `visual_reasoning`. Do not import `litellm`, call `litellm.completion()`, create new model-router clients, create ModelRouter classes, resolve model names, resolve API keys, import detector libraries/provider SDKs/`YOLO`, define `COCO_CLASSES`, hardcode model names, load `.pt` files, or call `YOLO(...)`. The model router only selects models for capabilities; do not ask it to execute stages, manage workflows, pass outputs between stages, or orchestrate pipelines.";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: issue.body + extraLine
            });
            
      - name: Assign issue creator
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Assign issue to Copilot
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ github.event.issue.number }}
          github_token: ${{ secrets.COPILOT_PAT }}
