name: Auto-assign to Copilot

on:
  issues:
    types: [opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Append text to issue body
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const extraLine = "\n\nWrite this Python tool inside `tools/`. Use take_photo for a static current-frame task, even when it may run continuously. Use hosted_video_streaming only when the answer requires recent history, sequence, duration, before/after comparison, or what just happened. For take_photo, declare `EXECUTION_MODE = \"take_photo\"`, author one concise `TOOL_PROMPT`, call `call_take_photo_vlm` exactly once, and do not declare `VIDEO_CONFIG`. For hosted_video_streaming, generate only `TOOL_NAME`, `EXECUTION_MODE`, required literal `VIDEO_CONFIG`, optional literal `OUTPUT_CONFIG`, and a temporal `TOOL_PROMPT`; the shared runtime owns buffering, MP4 encoding, hosted inference, and sessions. Do not create custom video processing, runtime stages, or extra model calls.";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: issue.body + extraLine
            });
            
      - name: Assign issue creator
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Assign issue to Copilot
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ github.event.issue.number }}
          github_token: ${{ secrets.COPILOT_PAT }}
