name: Auto-assign to Copilot

on:
  issues:
    types: [opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Append text to issue body
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const extraLine = "\n\nWrite this Python tool inside `tools/`. For take-photo mode, implement the issue's Task Stages exactly with one ordered `copilot_llm_call` per stage. Preserve each step instruction, pass useful earlier artifacts to later steps, and return the final step response. Do not choose models or add routing, retries, evaluators, or cascade escalation.";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: issue.body + extraLine
            });
            
      - name: Assign issue creator
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Assign issue to Copilot
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ github.event.issue.number }}
          github_token: ${{ secrets.COPILOT_PAT }}
