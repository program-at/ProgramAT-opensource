name: Auto-assign to Copilot

on:
  issues:
    types: [opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Append text to issue body
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const extraLine = "\n\nWrite this Python tool inside `tools/`. Treat Mode as a parser suggestion and make the final static-versus-temporal decision from Task, Expected output, and the preserved ORIGINAL_PROMPTS; correct Mode when they conflict. Use take_photo for static Streaming behavior and hosted_video_streaming when Streaming needs recent ordered history. Take Photo works for every tool and always uses one current image with the same `TOOL_PROMPT`; temporal prompts must use chronological motion when multiple frames exist, use only recognizable static evidence with one image, never invent unseen motion, and return task-specific uncertainty when one frame is insufficient. Temporal input does not imply before/after output fields: choose plain text or a task-specific supported schema independently. Never reuse `played_card_event` outside played-card detection. Copilot must choose and emit a literal `TOOL_POLICY`; default ordinary requests to one `gemini-3.1-flash-lite` model with strategy `single`. For take_photo, declare `EXECUTION_MODE = \"take_photo\"`, author one concise `TOOL_PROMPT`, and call `execute_tool_policy` exactly once with `policy=TOOL_POLICY`; do not declare `VIDEO_CONFIG`. For hosted_video_streaming, generate only `TOOL_NAME`, `EXECUTION_MODE`, required literal `VIDEO_CONFIG`, optional literal `OUTPUT_CONFIG`, `TOOL_POLICY`, and a temporal `TOOL_PROMPT`; the shared runtime owns buffering, MP4 encoding, hosted inference, and sessions. Do not create custom video processing, runtime stages, provider calls, routing loops, or extra model calls.";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: issue.body + extraLine
            });
            
      - name: Assign issue creator
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Assign issue to Copilot
        if: "contains(github.event.issue.body, 'Template: VAT')"
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ github.event.issue.number }}
          github_token: ${{ secrets.COPILOT_PAT }}
