name: Claude VAT Implementation

# PREREQUISITES - this workflow will silently fail without these:
# 1. Secret: Add ANTHROPIC_API_KEY to your repository secrets
#    (Settings → Secrets and variables → Actions → New repository secret)
# 2. GitHub App: Install the Claude GitHub App AND link it to your Anthropic account:
#    a. Install the app on your repo: https://github.com/apps/claude
#    b. Connect it to your Anthropic account: https://claude.ai/settings → GitHub
#    Both steps are required — doing only one will cause OIDC token exchange to fail.
# 3. Trigger: Add the label 'ready-for-claude' to an issue that contains 'Template: VAT'
#    in its body. The action will not run without both conditions being true.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write  

jobs:
  claude-vat:
    if: >
      contains(github.event.issue.labels.*.name, 'ready-for-claude') &&
      contains(github.event.issue.body, 'Template: VAT')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add implementation note and assign issue creator
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const implementationNote =
              "\n\nImplementation note: Write this Python tool inside `tools/`. Treat Mode as a parser suggestion and make the final static-versus-temporal decision from the request semantics and preserved ORIGINAL_PROMPTS. Use take_photo for static Streaming behavior and hosted_video_streaming when Streaming needs multiple ordered moments. Take Photo works for every tool with one current image; temporal prompts must use motion with multiple frames, static evidence with one image, and task-specific uncertainty when one frame is insufficient. Temporal input does not imply before/after output fields: prefer concise plain text for recognition and never reuse `played_card_event` outside played-card detection. For take_photo, declare `EXECUTION_MODE = \"take_photo\"`, use one `call_take_photo_vlm` call, and omit `VIDEO_CONFIG`. For hosted_video_streaming, generate only `TOOL_NAME`, `EXECUTION_MODE`, required literal `VIDEO_CONFIG`, optional literal `OUTPUT_CONFIG`, and a prompt describing chronological evidence; the shared runtime owns video and sessions. Do not create custom video processing or extra model calls. Open a PR rather than pushing to main.";
            if (!issue.body.includes("Write the code for this tool inside the tools folder")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: issue.body + implementationNote
              });
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login]
            });

      - name: Ask Claude to implement the VAT issue
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Before starting, read the file `.github/copilot-instructions.md` for project conventions and follow them strictly.

            Implement the request described in GitHub issue #${{ github.event.issue.number }}.
            Repository: ${{ github.repository }}
            Issue title: ${{ github.event.issue.title }}
            Issue body: ${{ github.event.issue.body }}
            Requirements:
            - Write the code for this tool inside the tools folder.
            - For take-photo mode, declare `EXECUTION_MODE = "take_photo"` and author one concise fused `TOOL_PROMPT` from the issue fields. Do not declare `VIDEO_CONFIG`.
            - Import `call_take_photo_vlm` from `litellm_utils`.
            - Call that helper exactly once with the supplied image and prompt, then return its answer directly.
            - For hosted_video_streaming, do not import that helper; declare required literal `VIDEO_CONFIG` and a prompt describing chronological evidence.
            - Do not create runtime stages or call a planner/router/evaluator.
            - Do not make any other model or specialist calls.
            - Follow the existing repository structure and style.
            - Make the smallest reasonable implementation.
            - Do not modify unrelated files.
            - Do not push to main.
            - Commit changes to a new branch.
            - Create or prepare a pull request for human review.
          claude_args: '--allowedTools "Bash(git:*),Bash(find:*),Bash(ls:*),View,GlobTool,GrepTool,Write,Edit" --max-turns 16 --model claude-sonnet-4-5'
