capabilities:

  general_reasoning:
    description: >
      High-level semantic understanding of a scene when no specialized capability
      dominates. Used for general scene descriptions, safety assessment, activity
      recognition, and open-ended visual reasoning.

    include_examples:
      - "Tell me what is happening around me right now."
      - "Give me a quick summary of this scene."
      - "Explain whether this environment looks safe."
      - "Describe what the people nearby are doing."
      - "Tell me anything unusual I should pay attention to."

    exclude_examples:
      - "Read the text on this package."
      - "Locate my phone."
      - "Guide me to the entrance."



  ocr:
    description: >
      Extract visible textual information accurately without interpreting its
      higher-level meaning.

    include_examples:
      - "Read the medication name and dosage."
      - "Read today's appointments."
      - "Tell me the expiration date."
      - "Read the handwritten note."
      - "Read the menu."

    exclude_examples:
      - "Summarize the chart."
      - "Interpret a subway map."
      - "Explain a webpage layout."



  object_detection_localization:
    description: >
      Detect requested objects and estimate their locations for downstream
      reasoning or interaction.

    include_examples:
      - "Find my phone."
      - "Locate the elevator button."
      - "Find an empty chair."
      - "Is there a door in front of me?"
      - "Detect obstacles."
      - "Identify the objects on this table."

    exclude_examples:
      - "Guide me to the exit."
      - "Describe the distance between two objects."
      - "Read the label on the bottle."



  structured_visual_understanding:
    description: >
      Interpret structured visual representations including charts, tables,
      diagrams, maps, dashboards, interfaces, layouts, icons, and symbols.

    include_examples:
      - "Explain this subway map."
      - "Interpret this bar chart."
      - "Describe this webpage layout."
      - "Explain the dashboard."
      - "Interpret the transit symbols."
      - "Summarize the information in this table."

    exclude_examples:
      - "Read plain text."
      - "Locate an object."
      - "Estimate distances."



  spatial_reasoning:
    description: >
      Infer relative positions, distances, orientations, and spatial relationships
      between objects and the user.

    include_examples:
      - "Where is my phone relative to me?"
      - "Is the chair left or right of the table?"
      - "How far away is the doorway?"
      - "Describe the room layout."
      - "Is the object above or below my hand?"

    exclude_examples:
      - "Read text."
      - "Interpret charts."
      - "Generate navigation instructions."



  navigation:
    description: >
      Generate actionable movement instructions toward a known destination using
      previously identified spatial information.

    include_examples:
      - "Guide me to the detected doorway."
      - "Navigate me to the chair you found."
      - "Tell me where to walk next."
      - "Warn me before I need to turn."
      - "Guide me through this hallway."

    exclude_examples:
      - "Locate the chair."
      - "Find the exit."
      - "Move the camera left."
      - "Read a sign."



  camera_motion:
    description: >
      Generate camera positioning or framing instructions to improve visual input
      quality.

    include_examples:
      - "Move the camera left."
      - "Center the target."
      - "Tilt the phone upward."
      - "Move closer."
      - "Zoom in."

    exclude_examples:
      - "Walk toward the entrance."
      - "Detect objects."
      - "Read text."



  temporal_reasoning:
    description: >
      Understand temporal events, motion, and changes across multiple frames.

    include_examples:
      - "Analyze what happened in this video."
      - "Describe the sequence of events."
      - "Explain how the scene changed."
      - "Track the movement of the object."
      - "Identify when the person entered the room."

    exclude_examples:
      - "Single image OCR."
      - "Single image object detection."
      - "Static scene description."