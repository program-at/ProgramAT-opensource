global:
  system_model:
    implementation: llama_planner

streaming:
  frame_selector:
    implementation: clip
    model: openai/clip-vit-base-patch32
    similarity_threshold: 0.985
    max_similarity_to_last_sent: 0.990
    max_skip_frames: 20

mode_execution:
  take-photo:
    cascade: default_reasoning
    planner_mode: FUSED_PROMPT
  streaming:
    cascade: default_reasoning
    planner_mode: FUSED_PROMPT

implementations:
  moondream_cloud:
    kind: moondream_cloud
    model: moondream/moondream3-preview

  llama_planner:
    kind: model
    model: groq/llama-3.1-8b-instant

  gemini_flash_lite:
    kind: model
    model: gemini/gemini-3.1-flash-lite-preview

  qwen:
    kind: model
    model: dashscope/qwen2.5-omni-7b

  gpt4o:
    kind: model
    model: openai/gpt-4o

  gpt4o-mini:
    kind: model
    model: openai/gpt-4o-mini

  gpt5:
    kind: openai_responses
    model: gpt-5

  google_vision:
    kind: google_vision

  mistral_ocr:
    kind: mistral_ocr

  tesseract_local:
    kind: tesseract

  yolo:
    kind: yolo
    model_name: yolo11n.pt

cascade_profiles:
  default_reasoning:
    candidates:
      - gemini_flash_lite
      - gpt5
    evaluator: gpt4o-mini
    result_passing: failed_attempts
    condition: C3_PASS_FAILED_ATTEMPTS
