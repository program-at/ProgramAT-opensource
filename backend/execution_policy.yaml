global:
  planner_enabled: true
  routing_enabled: false
  system_model:
    implementation: llama_planner
  default_llm_when_routing_disabled:
    implementation: moondream_cloud

streaming:
  frame_selector:
    implementation: clip
    model: openai/clip-vit-base-patch32
    similarity_threshold: 0.985
    max_similarity_to_last_sent: 0.990
    max_skip_frames: 20

implementations:
  moondream_cloud:
    kind: moondream_cloud
    model: moondream/moondream3-preview

  llama_planner:
    kind: model
    model: groq/llama-3.1-8b-instant

  gemini_flash_lite:
    kind: model
    model: gemini/gemini-3.1-flash-lite-preview

  qwen:
    kind: model
    model: dashscope/qwen2.5-omni-7b

  gpt4o:
    kind: model
    model: openai/gpt-4o

  gpt4o-mini:
    kind: model
    model: openai/gpt-4o-mini

  google_vision:
    kind: google_vision

  mistral_ocr:
    kind: mistral_ocr

  tesseract_local:
    kind: tesseract

  yolo:
    kind: yolo
    model_name: yolo11n.pt

cascade_profiles:
  default_reasoning:
    candidates:
      - moondream_cloud
      - gemini_flash_lite
      - gpt4o
    evaluator: gpt4o-mini

  ocr:
    candidates:
      - mistral_ocr
    evaluator: gpt4o-mini

general_reasoning:
  cascade: default_reasoning

ocr:
  cascade: ocr
  specialized: true

object_detection_localization:
  implementation: yolo
  specialized: true

structured_visual_understanding:
  cascade: default_reasoning

spatial_reasoning:
  cascade: default_reasoning

navigation:
  cascade: default_reasoning

camera_motion:
  cascade: default_reasoning

temporal_reasoning:
  cascade: default_reasoning
