global:
  planner_enabled: true
  routing_enabled: true
  system_model:
    implementation: llama_planner
  default_llm_when_routing_disabled:
    implementation: gemini_flash_lite

streaming:
  frame_selector:
    implementation: clip
    model: openai/clip-vit-base-patch32
    similarity_threshold: 0.985
    max_similarity_to_last_sent: 0.990
    max_skip_frames: 20

mode_execution:
  take-photo:
    cascade: c5_parallel_aggregation
    planner_mode: P2_FUSED_PROMPT
  streaming:
    cascade: c5_parallel_aggregation
    planner_mode: P2_FUSED_PROMPT

implementations:
  nvidia_hosted_vision:
    kind: nvidia_hosted
    model: nvidia/nemotron-nano-12b-v2-vl

  moondream_cloud:
    kind: moondream_cloud
    model: moondream/moondream3-preview

  llama_planner:
    kind: model
    model: groq/llama-3.1-8b-instant

  gemini_flash_lite:
    kind: model
    model: gemini/gemini-3.1-flash-lite-preview

  qwen:
    kind: model
    model: dashscope/qwen2.5-omni-7b

  gpt4o:
    kind: model
    model: openai/gpt-4o

  gpt4o-mini:
    kind: model
    model: openai/gpt-4o-mini

  gpt5:
    kind: openai_responses
    model: gpt-5

  google_vision:
    kind: google_vision

  mistral_ocr:
    kind: mistral_ocr

  tesseract_local:
    kind: tesseract

  yolo:
    kind: yolo
    model_name: yolo11n.pt

cascade_profiles:
  c5_parallel_aggregation:
    parallel_models:
      - nvidia_hosted_vision
      - gemini_flash_lite
      - gpt4o-mini
    aggregator: gpt4o-mini
    condition: C5_PARALLEL_AGGREGATION

  default_reasoning:
    candidates:
      - moondream_cloud
      - gemini_flash_lite
      - gpt5
    difficulty_starts:
      moondream: moondream_cloud
      gemini_flash_lite: gemini_flash_lite
      gpt5: gpt5
    default_difficulty_start: gemini_flash_lite
    evaluator: gpt4o-mini
    result_passing: failed_attempts
    condition: C3_PASS_FAILED_ATTEMPTS

  ocr:
    candidates:
      - mistral_ocr
    evaluator: gpt4o-mini

general_reasoning:
  cascade: default_reasoning

ocr:
  cascade: ocr
  specialized: true

object_detection_localization:
  implementation: yolo
  specialized: true

structured_visual_understanding:
  cascade: default_reasoning

spatial_reasoning:
  cascade: default_reasoning

navigation:
  cascade: default_reasoning

camera_motion:
  cascade: default_reasoning

temporal_reasoning:
  cascade: default_reasoning
